<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>شبكتي - Player</title>

<meta name="referrer" content="no-referrer">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.13/shaka-player.compiled.js"></script>

<style>
:root {
    --primary-color: #ffc107;
    --live-color: #e62e2e;
    --not-live-color: rgba(128,128,128,.8);
    --menu-bg: rgba(25,25,25,.95);
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Tajawal', sans-serif !important;
    -webkit-tap-highlight-color: transparent;
}

#player-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

#video-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 1;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#loading-spinner {
    position: absolute;
    z-index: 100;
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,.2);
    border-top-color: var(--primary-color);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#error-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.9);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

#error-overlay i {
    width: 48px;
    height: 48px;
    margin-bottom: 20px;
}

#error-overlay h3 {
    margin: 0 0 10px;
}

#error-overlay p {
    margin: 0;
    opacity: .8;
    line-height: 1.6;
}

.controls-overlay {
    position: absolute;
    z-index: 10;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .3s, visibility .3s;
}

.controls-overlay.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#bottom-controls-container {
    bottom: 0;
    left: 0;
    right: 0;
    padding: 5px 15px;
    background: linear-gradient(to top, rgba(0,0,0,.8), transparent);
}

#center-controls {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 30px;
}

.control-button,
.center-control-button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    outline: none;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}

.control-button:hover {
    color: var(--primary-color);
}

.control-button i,
.control-button svg {
    width: 22px;
    height: 22px;
}

.center-control-button {
    width: 70px;
    height: 70px;
}

.center-control-button i,
.center-control-button svg {
    width: 48px;
    height: 48px;
    filter: drop-shadow(0 0 8px rgba(0,0,0,.8));
}

#seek-backward-center-btn i {
    transform: scaleX(-1);
}

.progress-bar-container {
    width: 100%;
    padding: 10px 0;
    cursor: pointer;
}

.progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,.3);
    border-radius: 2px;
}

.progress-played {
    width: 0;
    height: 100%;
    background: var(--primary-color);
    border-radius: 2px;
}

.bottom-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5px;
}

.controls-left,
.controls-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

#live-indicator {
    font-weight: 700;
    font-size: .9rem;
    letter-spacing: .5px;
    padding: 4px 10px;
    border-radius: 50px;
    color: #fff;
    white-space: nowrap;
    transition: background-color .3s ease;
}

#live-indicator.is-live {
    background: var(--live-color);
}

#live-indicator.is-not-live {
    background: var(--not-live-color);
    cursor: pointer;
}

.popup-menu {
    position: absolute;
    bottom: 60px;
    width: 200px;
    max-height: 200px;
    overflow-y: auto;
    background: var(--menu-bg);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    z-index: 20;
    display: none;
}

.popup-menu-list {
    list-style: none;
    padding: 5px;
    margin: 0;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 500;
    color: #fff;
}

.menu-item:hover {
    background: rgba(255,255,255,.1);
}

.menu-item.active {
    color: var(--primary-color);
    font-weight: 700;
}

@media (max-width: 600px) {
    #center-controls {
        gap: 15px;
    }

    .center-control-button {
        width: 60px;
        height: 60px;
    }

    .controls-left,
    .controls-right {
        gap: 10px;
    }

    .control-button i,
    .control-button svg {
        width: 20px;
        height: 20px;
    }
}
</style>
</head>

<body>

<div id="player-container">

    <div id="loading-spinner"></div>

    <div id="error-overlay">
        <i data-feather="alert-triangle"></i>
        <h3 id="error-title">فشل تحميل البث</h3>
        <p id="error-message">
            قد يكون البث متوقفًا حاليًا أو توجد مشكلة في الشبكة.
        </p>
    </div>

    <div id="video-wrapper">

        <video
            id="video"
            autoplay
            playsinline
            preload="auto">
        </video>

    </div>

    <div id="quality-popup" class="popup-menu">
        <ul id="quality-list" class="popup-menu-list"></ul>
    </div>

    <div id="audio-popup" class="popup-menu">
        <ul id="audio-list" class="popup-menu-list"></ul>
    </div>

    <div id="center-controls" class="controls-overlay visible">

        <button
            class="center-control-button"
            id="seek-backward-center-btn"
            title="رجوع 10 ثواني">
            <i data-feather="rewind"></i>
        </button>

        <button
            class="center-control-button"
            id="play-pause-center-btn"
            title="تشغيل/إيقاف">
            <i data-feather="play"></i>
        </button>

        <button
            class="center-control-button"
            id="seek-forward-center-btn"
            title="تقديم 10 ثواني">
            <i data-feather="fast-forward"></i>
        </button>

    </div>

    <div id="bottom-controls-container" class="controls-overlay">

        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-played"></div>
            </div>
        </div>

        <div class="bottom-controls">

            <div class="controls-left">

                <button
                    class="control-button"
                    id="play-pause-btn"
                    title="تشغيل/إيقاف">
                    <i data-feather="play"></i>
                </button>

                <button
                    class="control-button"
                    id="mute-btn"
                    title="كتم الصوت">
                    <i data-feather="volume-2"></i>
                </button>

                <button
                    class="control-button"
                    id="quality-btn"
                    title="الجودة">
                    <i data-feather="settings"></i>
                </button>

                <button
                    class="control-button"
                    id="audio-btn"
                    title="الصوت">
                    <i data-feather="headphones"></i>
                </button>

                <div id="live-indicator"></div>

            </div>

            <div class="controls-right">

                <button
                    class="control-button"
                    id="pip-btn"
                    title="نافذة ضمن نافذة">
                    <i data-feather="airplay"></i>
                </button>

                <button
                    class="control-button"
                    id="expand-btn"
                    title="تغيير وضع العرض">
                </button>

                <button
                    class="control-button"
                    id="fullscreen-btn"
                    title="ملء الشاشة">
                    <i data-feather="maximize"></i>
                </button>

            </div>

        </div>

    </div>

</div>

<script>

document.addEventListener('DOMContentLoaded', async () => {

    const elements = {
        video: document.getElementById('video'),
        playerContainer: document.getElementById('player-container'),
        videoWrapper: document.getElementById('video-wrapper'),

        centerControls: document.getElementById('center-controls'),
        bottomControls: document.getElementById('bottom-controls-container'),

        playPauseBtn: document.getElementById('play-pause-btn'),
        playPauseCenterBtn: document.getElementById('play-pause-center-btn'),

        muteBtn: document.getElementById('mute-btn'),
        pipBtn: document.getElementById('pip-btn'),
        expandBtn: document.getElementById('expand-btn'),
        fullscreenBtn: document.getElementById('fullscreen-btn'),

        liveIndicator: document.getElementById('live-indicator'),

        progressPlayed: document.querySelector('.progress-played'),
        progressBarContainer: document.querySelector('.progress-bar-container'),

        qualityBtn: document.getElementById('quality-btn'),
        audioBtn: document.getElementById('audio-btn'),

        qualityPopup: document.getElementById('quality-popup'),
        audioPopup: document.getElementById('audio-popup'),

        loadingSpinner: document.getElementById('loading-spinner'),

        errorOverlay: document.getElementById('error-overlay'),
        errorTitle: document.getElementById('error-title'),
        errorMessage: document.getElementById('error-message')
    };

    /*
     * ============================================================
     * إعداد البث
     * ============================================================
     *
     * ضع رابط الـ MPD هنا.
     *
     * إذا كان البث بدون DRM:
     * CLEARKY_KID = ''
     * CLEARKY_KEY = ''
     *
     * إذا كان ClearKey:
     *
     * KID:
     * 47f0ab58f5a81c20b5b69dc494cbe102
     *
     * KEY:
     * 1e0719da653c2b4652f0b0bf84d96c74
     */

    const STREAM_URL =
        'https://scccrwb-live.cdn.intigral-ott.net/bpk-tv/STC/wv-pr/manifest.mpd';

    const CLEARKY_KID =
        '47f0ab58f5a81c20b5b69dc494cbe102';

    const CLEARKY_KEY =
        '1e0719da653c2b4652f0b0bf84d96c74';


    /*
     * ============================================================
     * Shaka Player
     * ============================================================
     */

    if (!shaka.Player.isBrowserSupported()) {

        showError(
            'المتصفح غير مدعوم',
            'هذا الجهاز أو المتصفح لا يدعم تشغيل هذا النوع من البث.'
        );

        return;
    }

    const player = new shaka.Player(elements.video);


    /*
     * ============================================================
     * إعداد المشغل
     * ============================================================
     */

    player.configure({

        manifest: {
            dash: {
                ignoreMinBufferTime: true
            }
        },

        streaming: {

            rebufferingGoal: 2,

            bufferingGoal: 10,

            bufferBehind: 30,

            retryParameters: {

                timeout: 15000,

                maxAttempts: 4,

                baseDelay: 1000,

                backoffFactor: 2

            }

        },

        abr: {

            enabled: true,

            defaultBandwidthEstimate: 3000000

        }

    });


    /*
     * ============================================================
     * ClearKey
     * ============================================================
     *
     * Shaka يحتاج:
     *
     * KID : KEY
     *
     * بصيغة Hex.
     */

    if (CLEARKY_KID && CLEARKY_KEY) {

        const clearKeys = {};

        clearKeys[CLEARKY_KID] = CLEARKY_KEY;

        player.configure({
            drm: {
                clearKeys: clearKeys
            }
        });

    }


    /*
     * ============================================================
     * أيقونة تغيير حجم الفيديو
     * ============================================================
     */

    const expandSvg = `
        <svg
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 100 100">

            <path d="M22.6 20.5H36c1.1 0 2-.9 2-2s-.9-2-2-2H19c-1.1 0-2.5 1.2-2.5 2.4v17c0 1.1.9 2 2 2s2-.9 2-2V24.9l16 15.8c.4.4 1 .6 1.5.6s1.1-.2 1.5-.6c.8-.8.8-2.2 0-3L22.6 20.5z"/>

            <path d="M83 16.5H66c-1.1 0-2 .9-2 2s.9 2 2 2h12.6L61.6 37.6c-.8.8-.8 2.1 0 2.9.4.4.9.6 1.4.6s.8-.2 1.2-.6l16.3-16.5v11.7c0 1.1.9 2 2 2s2-.9 2-2v-17c0-1.1-.5-2.2-1.5-2.2z"/>

            <path d="M36.5 61L20.5 76.8V65.9c0-1.1-.9-2-2-2s-2 .9-2 2v17c0 1.1 1.4 1.6 2.5 1.6h17c1.1 0 2-.9 2-2s-.9-2-2-2H22.5l17.1-15.9c.8-.8.7-2-.1-2.7-.8-.8-2.2-.7-3 .1z"/>

            <path d="M82.5 63.9c-1.1 0-2 .9-2 2v11.6L64.2 61c-.8-.8-1.9-.8-2.7 0-.8.8-.7 1.9.1 2.6l17.2 16.9H66c-1.1 0-2 .9-2 2s.9 2 2 2h17c1.1 0 1.5-.5 1.5-1.6v-17c0-1.1-.9-2-2-2z"/>

        </svg>
    `;

    elements.expandBtn.innerHTML = expandSvg;

    feather.replace();


    /*
     * ============================================================
     * حالة المشغل
     * ============================================================
     */

    let controlsTimeout = null;
    let clickTimer = null;
    let retryTimer = null;

    let expandModeIndex = 0;

    const expandModes = [
        'contain',
        'cover',
        'fill'
    ];


    /*
     * ============================================================
     * تحميل البث
     * ============================================================
     */

    async function initializePlayer() {

        elements.loadingSpinner.style.display = 'flex';

        hideError();

        try {

            await player.load(STREAM_URL);

            elements.loadingSpinner.style.display = 'none';

            showControls();

            /*
             * تشغيل مباشر.
             *
             * إذا منع المتصفح التشغيل بالصوت،
             * نحاول التشغيل مكتومًا.
             */

            elements.video.muted = false;

            try {

                await elements.video.play();

            } catch (error) {

                console.warn(
                    'Autoplay with sound was blocked.'
                );

                elements.video.muted = true;

                try {
                    await elements.video.play();
                } catch (e) {
                    console.warn(
                        'Autoplay was blocked completely.'
                    );
                }

            }

        } catch (error) {

            console.error(
                'Failed to load stream:',
                error
            );

            elements.loadingSpinner.style.display = 'none';

            showError(
                'فشل تحميل البث',
                'تعذر تشغيل البث. تحقق من الرابط أو المفتاح وحاول مرة أخرى.'
            );
        }
    }


    /*
     * ============================================================
     * الأخطاء
     * ============================================================
     */

    function showError(title, message) {

        elements.loadingSpinner.style.display = 'none';

        elements.errorTitle.textContent = title;

        elements.errorMessage.textContent = message;

        elements.errorOverlay.style.display = 'flex';

        feather.replace();
    }


    function hideError() {

        elements.errorOverlay.style.display = 'none';
    }


    function handlePlayerError(error) {

        console.error(
            'Shaka Error:',
            error.code,
            error.detail
        );

        const recoverableErrors = [

            shaka.util.Error.Code.HTTP_ERROR,

            shaka.util.Error.Code.TIMEOUT,

            shaka.util.Error.Code.BAD_HTTP_STATUS,

            shaka.util.Error.Code.SEGMENT_MISSING

        ];

        if (
            recoverableErrors.includes(error.code)
        ) {

            clearTimeout(retryTimer);

            elements.loadingSpinner.style.display = 'flex';

            retryTimer = setTimeout(async () => {

                try {

                    await player.unload();

                    await player.load(STREAM_URL);

                    elements.loadingSpinner.style.display = 'none';

                    hideError();

                } catch (e) {

                    console.error(
                        'Stream recovery failed:',
                        e
                    );

                    showError(
                        'انقطع الاتصال بالبث',
                        'نحاول إعادة الاتصال بالبث، يرجى الانتظار قليلاً.'
                    );

                }

            }, 2000);

        } else {

            let message =
                'حدث خطأ أثناء تشغيل البث.';

            if (
                error &&
                error.detail &&
                error.detail.message
            ) {
                message = error.detail.message;
            }

            showError(
                'حدث خطأ في المشغل',
                message
            );
        }
    }


    /*
     * ============================================================
     * التحكم بالواجهة
     * ============================================================
     */

    function showControls() {

        [
            elements.bottomControls,
            elements.centerControls

        ].forEach(element => {

            element.classList.add('visible');

        });

        clearTimeout(controlsTimeout);

        if (!elements.video.paused) {

            controlsTimeout =
                setTimeout(
                    hideControls,
                    3000
                );

        }
    }


    function hideControls() {

        if (
            document.fullscreenElement &&
            elements.video.paused
        ) {
            return;
        }

        [
            elements.bottomControls,
            elements.centerControls

        ].forEach(element => {

            element.classList.remove('visible');

        });

        elements.qualityPopup.style.display =
            'none';

        elements.audioPopup.style.display =
            'none';
    }


    /*
     * ============================================================
     * تشغيل / إيقاف
     * ============================================================
     */

    function togglePlay() {

        if (elements.video.paused) {

            elements.video.play()
                .catch(error => {

                    console.warn(
                        'Play failed:',
                        error
                    );

                });

        } else {

            elements.video.pause();

        }
    }


    function updatePlayButton() {

        const icon =
            elements.video.paused
                ? 'play'
                : 'pause';

        elements.playPauseBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        elements.playPauseCenterBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        feather.replace();
    }


    /*
     * ============================================================
     * الصوت
     * ============================================================
     */

    function updateVolumeIcon() {

        const icon =
            elements.video.muted ||
            elements.video.volume === 0
                ? 'volume-x'
                : 'volume-2';

        elements.muteBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        feather.replace();
    }


    /*
     * ============================================================
     * ملء الشاشة
     * ============================================================
     */

    async function toggleFullscreen() {

        try {

            if (!document.fullscreenElement) {

                await elements.playerContainer.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.warn(
                'Fullscreen error:',
                error
            );

        }
    }


    function updateFullscreenIcon() {

        const icon =
            document.fullscreenElement
                ? 'minimize'
                : 'maximize';

        elements.fullscreenBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        feather.replace();
    }


    /*
     * ============================================================
     * القوائم
     * ============================================================
     */

    function togglePopup(
        button,
        popup,
        populate
    ) {

        const otherPopup =
            popup === elements.qualityPopup
                ? elements.audioPopup
                : elements.qualityPopup;

        otherPopup.style.display =
            'none';

        if (popup.style.display === 'block') {

            popup.style.display = 'none';

            return;
        }

        if (populate) {
            populate();
        }

        const containerRect =
            elements.playerContainer
                .getBoundingClientRect();

        const buttonRect =
            button.getBoundingClientRect();

        const popupWidth =
            popup.offsetWidth || 200;

        const buttonCenter =
            (
                buttonRect.left -
                containerRect.left
            ) +
            buttonRect.width / 2;

        let popupLeft =
            buttonCenter -
            popupWidth / 2;

        popupLeft =
            Math.max(
                10,
                popupLeft
            );

        popupLeft =
            Math.min(
                popupLeft,
                containerRect.width -
                popupWidth -
                10
            );

        popup.style.left =
            `${popupLeft}px`;

        popup.style.display =
            'block';
    }


    /*
     * ============================================================
     * الجودة
     * ============================================================
     */

    function populateQualityMenu() {

        const list =
            document.getElementById(
                'quality-list'
            );

        list.innerHTML = '';

        const config =
            player.getConfiguration();

        const abrEnabled =
            config.abr.enabled;

        const tracks =
            player.getVariantTracks();

        const activeTrack =
            tracks.find(
                track => track.active
            );


        const autoItem =
            document.createElement('li');

        autoItem.className =
            `menu-item ${
                abrEnabled
                    ? 'active'
                    : ''
            }`;

        autoItem.textContent =
            'تلقائي';

        autoItem.onclick = () => {

            player.configure(
                'abr.enabled',
                true
            );

            elements.qualityPopup.style.display =
                'none';

        };

        list.appendChild(autoItem);


        const heights =
            [
                ...new Set(
                    tracks
                        .map(track => track.height)
                        .filter(Boolean)
                )
            ]
            .sort((a,b) => b-a);


        heights.forEach(height => {

            const track =
                tracks.find(
                    item =>
                        item.height === height
                );

            if (!track) return;

            const item =
                document.createElement('li');

            item.className =
                `menu-item ${
                    !abrEnabled &&
                    activeTrack &&
                    activeTrack.height === height
                        ? 'active'
                        : ''
                }`;

            item.textContent =
                `${height}p`;

            item.onclick = () => {

                player.configure(
                    'abr.enabled',
                    false
                );

                player.selectVariantTrack(
                    track,
                    true
                );

                elements.qualityPopup.style.display =
                    'none';
            };

            list.appendChild(item);

        });
    }


    /*
     * ============================================================
     * الصوت / اللغات
     * ============================================================
     */

    function populateAudioMenu() {

        const list =
            document.getElementById(
                'audio-list'
            );

        list.innerHTML = '';

        const audioTracks =
            player.getAudioLanguagesAndRoles();

        const currentLanguage =
            player.getAudioLanguages()[0];


        audioTracks.forEach(track => {

            const item =
                document.createElement('li');

            item.className =
                `menu-item ${
                    track.language === currentLanguage
                        ? 'active'
                        : ''
                }`;

            item.textContent =
                track.label ||
                track.language ||
                'الصوت';

            item.onclick = () => {

                player.selectAudioLanguage(
                    track.language,
                    track.role
                );

                elements.audioPopup.style.display =
                    'none';

            };

            list.appendChild(item);

        });
    }


    /*
     * ============================================================
     * الوقت
     * ============================================================
     */

    function formatTime(seconds) {

        if (
            !Number.isFinite(seconds) ||
            seconds < 0
        ) {
            return '00:00';
        }

        const hours =
            Math.floor(seconds / 3600);

        const minutes =
            Math.floor(
                (seconds % 3600) / 60
            );

        const secs =
            Math.floor(seconds % 60);


        if (hours > 0) {

            return [
                hours,
                minutes,
                secs
            ]
                .map(
                    value =>
                        String(value)
                            .padStart(2,'0')
                )
                .join(':');

        }

        return [
            minutes,
            secs
        ]
            .map(
                value =>
                    String(value)
                        .padStart(2,'0')
            )
            .join(':');
    }


    /*
     * ============================================================
     * أحداث الفيديو
     * ============================================================
     */

    elements.video.addEventListener(
        'play',
        () => {

            updatePlayButton();

            showControls();

        }
    );


    elements.video.addEventListener(
        'pause',
        () => {

            updatePlayButton();

            showControls();

        }
    );


    elements.video.addEventListener(
        'volumechange',
        updateVolumeIcon
    );


    elements.video.addEventListener(
        'timeupdate',
        () => {

            const range =
                player.seekRange();

            if (
                !Number.isFinite(range.end)
            ) {
                return;
            }


            if (player.isLive()) {

                elements.liveIndicator.style.display =
                    'inline-block';

                const behind =
                    range.end -
                    elements.video.currentTime;

                const isBehind =
                    elements.video.paused ||
                    behind > 15;

                elements.liveIndicator.className =
                    isBehind
                        ? 'is-not-live'
                        : 'is-live';

                elements.liveIndicator.innerHTML =
                    isBehind
                        ? '● متأخر'
                        : '● مباشر';

            } else {

                const duration =
                    range.end -
                    range.start;

                if (duration <= 0) {
                    return;
                }

                const position =
                    elements.video.currentTime -
                    range.start;

                const percentage =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            position /
                            duration *
                            100
                        )
                    );

                elements.progressPlayed.style.width =
                    `${percentage}%`;

                elements.liveIndicator.style.display =
                    'inline-block';

                elements.liveIndicator.className =
                    '';

                elements.liveIndicator.style.background =
                    'transparent';

                elements.liveIndicator.style.cursor =
                    'default';

                elements.liveIndicator.innerHTML =
                    `${formatTime(elements.video.currentTime)}
                     / ${formatTime(range.end)}`;
            }
        }
    );


    /*
     * ============================================================
     * النقر على شريط التقدم
     * ============================================================
     */

    elements.progressBarContainer.addEventListener(
        'click',
        event => {

            if (player.isLive()) {
                return;
            }

            const range =
                player.seekRange();

            const rect =
                elements.progressBarContainer
                    .getBoundingClientRect();

            const percentage =
                (
                    event.clientX -
                    rect.left
                ) /
                rect.width;

            elements.video.currentTime =
                range.start +
                percentage *
                (
                    range.end -
                    range.start
                );
        }
    );


    /*
     * ============================================================
     * الانتقال إلى البث المباشر
     * ============================================================
     */

    elements.liveIndicator.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            if (
                player.isLive() &&
                elements.liveIndicator
                    .classList
                    .contains('is-not-live')
            ) {

                const range =
                    player.seekRange();

                elements.video.currentTime =
                    range.end;
            }
        }
    );


    /*
     * ============================================================
     * التقديم والرجوع
     * ============================================================
     */

    document
        .getElementById(
            'seek-forward-center-btn'
        )
        .addEventListener(
            'click',
            event => {

                event.stopPropagation();

                elements.video.currentTime += 10;

            }
        );


    document
        .getElementById(
            'seek-backward-center-btn'
        )
        .addEventListener(
            'click',
            event => {

                event.stopPropagation();

                elements.video.currentTime -= 10;

            }
        );


    /*
     * ============================================================
     * أزرار التحكم
     * ============================================================
     */

    elements.playPauseBtn.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            togglePlay();

        }
    );


    elements.playPauseCenterBtn.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            togglePlay();

        }
    );


    elements.muteBtn.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            elements.video.muted =
                !elements.video.muted;

            updateVolumeIcon();

        }
    );


    /*
     * ============================================================
     * Picture in Picture
     * ============================================================
     */

    elements.pipBtn.addEventListener(
        'click',
        async event => {

            event.stopPropagation();

            try {

                if (
                    document.pictureInPictureElement
                ) {

                    await document
                        .exitPictureInPicture();

                } else if (
                    document.pictureInPictureEnabled
                ) {

                    await elements.video
                        .requestPictureInPicture();

                }

            } catch (error) {

                console.warn(
                    'PiP error:',
                    error
                );

            }
        }
    );


    /*
     * ============================================================
     * تغيير حجم الفيديو
     * ============================================================
     */

    elements.expandBtn.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            expandModeIndex =
                (
                    expandModeIndex + 1
                ) %
                expandModes.length;

            elements.video.style.objectFit =
                expandModes[
                    expandModeIndex
                ];

        }
    );


    /*
     * ============================================================
     * ملء الشاشة
     * ============================================================
     */

    elements.fullscreenBtn.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            toggleFullscreen();

        }
    );


    document.addEventListener(
        'fullscreenchange',
        updateFullscreenIcon
    );


    /*
     * ============================================================
     * فتح وإغلاق الواجهة
     * ============================================================
     */

    elements.videoWrapper.addEventListener(
        'click',
        event => {

            if (
                event.target !==
                elements.videoWrapper
            ) {
                return;
            }

            clearTimeout(clickTimer);

            clickTimer =
                setTimeout(() => {

                    if (
                        elements.bottomControls
                            .classList
                            .contains('visible')
                    ) {

                        hideControls();

                    } else {

                        showControls();

                    }

                }, 200);
        }
    );


    elements.videoWrapper.addEventListener(
        'dblclick',
        async event => {

            if (
                event.target !==
                elements.videoWrapper
            ) {
                return;
            }

            clearTimeout(clickTimer);

            await toggleFullscreen();

        }
    );


    elements.playerContainer.addEventListener(
        'mousemove',
        showControls
    );


    /*
     * ============================================================
     * الجودة والصوت
     * ============================================================
     */

    elements.qualityBtn.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            togglePopup(
                event.currentTarget,
                elements.qualityPopup,
                populateQualityMenu
            );

        }
    );


    elements.audioBtn.addEventListener(
        'click',
        event => {

            event.stopPropagation();

            togglePopup(
                event.currentTarget,
                elements.audioPopup,
                populateAudioMenu
            );

        }
    );


    /*
     * ============================================================
     * Shaka Events
     * ============================================================
     */

    player.addEventListener(
        'error',
        event => {

            handlePlayerError(
                event.detail
            );

        }
    );


    player.addEventListener(
        'trackschanged',
        () => {

            populateQualityMenu();

            populateAudioMenu();

        }
    );


    player.addEventListener(
        'buffering',
        event => {

            elements.loadingSpinner.style.display =
                event.buffering
                    ? 'flex'
                    : 'none';

        }
    );


    /*
     * ============================================================
     * بدء المشغل
     * ============================================================
     */

    await initializePlayer();

});

</script>

</body>
</html>
